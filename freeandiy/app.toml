# This repository's FreeANDIY settings (branding.toml is shared by all FreeANDIY repositories).
# Modified-by: FreeANDIY (Free Andy Agency), 2026. New file, not part of upstream DesignCraft.

app = "layout" # which [apps.<id>] entry of branding.toml this repository builds

[build]
# cargo arguments for the release binaries, the tests sync-upstream.sh runs, and the web page.
bins = "-p designcraft -p designcraft-cli"
features = ""
tests = "-p designcraft-ui-egui -p designcraft-engine -p designcraft -p designcraft-cli"
web_index = "apps/designcraft-web/index.html"
test_env = ""
web_env = ""
# Upstream has no test workflow of its own: freeandiy.yml runs build.tests on Linux.
ci_tests = "true"

[check]
# check-branding.sh: extra allowed strings (regex) and Rust paths where the upstream name may stay
# in string literals (git pathspecs, space-separated).
allow = ""
rs_exclude = ":!xtask/**"
